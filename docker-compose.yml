services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - streamhub_mysql:/var/lib/mysql
    healthcheck:
      # Docker Desktop on Windows may need several minutes to initialize MySQL 8.4
      # on a brand-new volume. During start_period failures do not count toward
      # retries. TCP also avoids declaring the temporary --skip-networking server healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 60

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "${PHPMYADMIN_PUBLIC_PORT:-18743}:80"
    depends_on:
      mysql:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    working_dir: /opt/streamhub
    command: ["alembic", "-c", "/opt/streamhub/alembic.ini", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  chat-ingest:
    build:
      context: .
      dockerfile: apps/chat_ingest/Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  twitch-adapter:
    build:
      context: .
      dockerfile: apps/twitch_adapter/Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      chat-ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  video-recorder:
    build:
      context: .
      dockerfile: apps/video_recorder/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - streamhub_video_spool:/spool
      - type: bind
        source: ${VIDEO_OUTPUT_ROOT_1_HOST:?set VIDEO_OUTPUT_ROOT_1_HOST in .env to an absolute host path, e.g. D:/StreamHub/output}
        target: /outputs/root1
      - type: bind
        source: ${VIDEO_OUTPUT_ROOT_2_HOST:?set VIDEO_OUTPUT_ROOT_2_HOST in .env to an absolute host path, e.g. E:/StreamHub/output}
        target: /outputs/root2
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  video-part-builder:
    build:
      context: .
      dockerfile: apps/video_part_builder/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${VIDEO_OUTPUT_ROOT_1_HOST:?set VIDEO_OUTPUT_ROOT_1_HOST in .env to an absolute host path, e.g. D:/StreamHub/output}
        target: /outputs/root1
      - type: bind
        source: ${VIDEO_OUTPUT_ROOT_2_HOST:?set VIDEO_OUTPUT_ROOT_2_HOST in .env to an absolute host path, e.g. E:/StreamHub/output}
        target: /outputs/root2
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      - "${API_PUBLIC_PORT:-18741}:8000"
    volumes:
      - ./telegram_state:/telegram_state
      - streamhub_site_assets:/site_assets
    depends_on:
      migrate:
        condition: service_completed_successfully
      twitch-adapter:
        condition: service_healthy
      video-part-builder:
        condition: service_healthy

  registration-bot:
    build:
      context: .
      dockerfile: apps/registration_bot/Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18741}
    ports:
      - "${WEB_PUBLIC_PORT:-18742}:3000"
    depends_on:
      - api

volumes:
  streamhub_mysql:
  streamhub_video_spool:
  streamhub_site_assets:
