<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamHub</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>StreamHub</h1>
    <div id="status" class="status">Определяю контекст…</div>
    <div id="details" class="details"></div>
    <fieldset id="controls" class="control-surface">
      <div class="capture-toggles">
        <label class="toggle"><input id="chat-toggle" type="checkbox" /> <span>Chat</span></label>
        <label class="toggle"><input id="video-toggle" type="checkbox" /> <span>Video</span></label>
      </div>
      <button id="start" class="primary wide">Start selected</button>
      <div class="section-title">Chat</div>
      <div class="actions three">
        <button id="pause-chat">Pause</button>
        <button id="resume-chat">Resume</button>
        <button id="stop-chat" class="danger">Stop Chat</button>
      </div>
      <div class="section-title">Video</div>
      <div class="actions three">
        <button id="pause-video">Pause</button>
        <button id="resume-video">Resume</button>
        <button id="stop-video" class="danger">Stop Video</button>
      </div>
      <button id="stop-all" class="danger wide">Stop All</button>
      <button id="auth" class="wide auth">Authorize Twitch</button>
    </fieldset>
    <div id="message" class="message"></div>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
